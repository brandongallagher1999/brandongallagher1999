      <stop offset="0" stop-color="#0c0507"/>
      <stop offset="0.45" stop-color="#3b0712"/>
      <stop offset="1" stop-color="#0c0507"/>
    </linearGradient>
    <radialGradient id="nebulaA" cx="78%" cy="22%" r="55%">
      <stop offset="0" stop-color="#e11d48" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#881337" stop-opacity="0.22"/>
      <stop offset="1" stop-color="#0c0507" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="nebulaB" cx="18%" cy="78%" r="48%">
